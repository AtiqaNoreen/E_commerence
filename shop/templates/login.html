{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>


<link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

<style>
    body{
        background:#f5f5f5;
    }

    .login-card{
        background:#fff;
        padding:40px;
        border-radius:10px;
        box-shadow:0 0 20px rgba(0,0,0,0.1);
        margin-top:80px;
    }

    .login-title{
        text-align:center;
        margin-bottom:25px;
        font-weight:bold;
    }
</style>


</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">

        <div class="login-card">

            <h2 class="login-title">Login</h2>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Username"
                           required>
                </div>

                <div class="mb-3">
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Password"
                           required>
                </div>

                <div class="mb-3">
                    <button type="submit"
                            class="btn btn-dark w-100">
                        Sign In
                    </button>
                </div>

            </form>

            <p class="text-center">
                Don't have an account?
                <a href="#">Register Now</a>
            </p>

            <p class="text-center">
                <a href="{% url 'home' %}">
                    Back to Home
                </a>
            </p>

        </div>

    </div>
</div>


</div>

</body>
</html>
